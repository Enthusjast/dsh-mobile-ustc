openapi: 3.1.0
info:
  title: DSH Mobile Remote Control API
  version: 0.1.0
  description: Authenticated control plane and optional quarantined file uploads implemented by the Go service. File routes require explicit protected storage/scanner configuration and an operational scanner probe. Push routes and workers require a separate protected configuration; provider acceptance never grants interaction authority.
servers:
  - url: https://remote.example.edu
security:
  - DPoP: []
paths:
  /healthz:
    get:
      security: []
      responses:
        '204': { description: Process is alive }
  /readyz:
    get:
      security: []
      responses:
        '204': { description: PostgreSQL is reachable }
        '503': { $ref: '#/components/responses/Error' }
  /v1/me:
    get:
      responses:
        '200':
          description: Verified token identity, resource scopes and the authoritative active service user with current organization memberships. Requires a provisioned active user; available before device enrollment. Memberships do not grant runtime access.
          headers:
            DPoP-Nonce: { $ref: '#/components/headers/DPoP-Nonce' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/devices:
    post:
      description: Phone-client registration. Separately allowlisted host OAuth clients cannot register phone credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegistration'
      responses:
        '201':
          description: Device keys are registered for the verified user. The proof key must match the DPoP-bound access token; an ES256 approval-key possession proof binds the identity, keys, name digest and current DPoP request. The keys must be distinct. A fresh authenticated proof with the same account, key pair, normalized name and version 1 returns the original device without another audit row. Changed data conflicts; revoked devices are never revived.
          headers:
            DPoP-Nonce: { $ref: '#/components/headers/DPoP-Nonce' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/devices/current:
    get:
      description: Reconcile phone enrollment using only the verified issuer, subject and token-bound DPoP key. Host OAuth clients are denied. Caller-supplied device/key selectors are ignored. This read is available before enrollment and for a revoked key; it grants no resource access and returns no other account/device.
      responses:
        '200':
          description: Current enrollment state for the authenticated key.
          headers:
            DPoP-Nonce: { $ref: '#/components/headers/DPoP-Nonce' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentDeviceResponse'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/devices/{id}:
    delete:
      parameters:
        - $ref: '#/components/parameters/UUID'
      responses:
        '200':
          description: Device revocation is stored transactionally with an audit row and control-outbox event. Repeating a successful revocation is idempotent.
          headers:
            DPoP-Nonce: { $ref: '#/components/headers/DPoP-Nonce' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRevoked'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/enrollments:
    post:
      description: Host-client-only registration. The installation public key must match the DPoP proof key; enrollment codes are generated by the host and never stored in plaintext.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollmentCreateRequest' }
      responses:
        '201':
          description: Creates a five-minute pending enrollment and a runtime with the requested opaque workspace references.
          headers:
            DPoP-Nonce: { $ref: '#/components/headers/DPoP-Nonce' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollmentCreated' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/enrollments/{id}:
    get:
      parameters:
        - $ref: '#/components/parameters/UUID'
      responses:
        '200':
          description: Status for the initiating installation owner or the user who confirmed. Phone access requires a registered device; an allowlisted host client must also prove the matching installation key. The code is never returned.
          headers:
            DPoP-Nonce: { $ref: '#/components/headers/DPoP-Nonce' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollmentDetails' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/enrollments/{id}/host-review:
    get:
      description: Installation-owner-only review, requiring the allowlisted host client, the registered installation DPoP key and a non-revoked host, installation and runtime. Returns the verified identity of the already confirmed phone user and current eligibility. Rejects query selectors; never returns the enrollment code.
      parameters:
        - $ref: '#/components/parameters/UUID'
      responses:
        '200':
          description: Key-bound enrollment and confirming-user review.
          headers:
            DPoP-Nonce: { $ref: '#/components/headers/DPoP-Nonce' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollmentHostReview' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/enrollments/{id}/preview:
    post:
      description: Read-only phone preview before confirmation. Requires a registered device, current organization membership and the exact 256-bit code in the JSON body. Does not activate resources or create grants.
      parameters:
        - $ref: '#/components/parameters/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollmentCodeRequest' }
      responses:
        '200':
          description: Verified display metadata, installation key thumbprint and current-account confirmation attribution, without the code.
          headers:
            DPoP-Nonce: { $ref: '#/components/headers/DPoP-Nonce' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollmentDetails' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/enrollments/{id}/confirm:
    post:
      parameters:
        - $ref: '#/components/parameters/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollmentCodeRequest' }
      responses:
        '200':
          description: Phone user confirmation; the enrollment stays pending until the host owner confirms with the installation key.
          headers:
            DPoP-Nonce: { $ref: '#/components/headers/DPoP-Nonce' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollmentConfirmation' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/enrollments/{id}/host-confirm:
    post:
      description: Host-client-only local confirmation after phone confirmation. The DPoP key must match the installation, and confirmed_user_id must match the identity reviewed by the host.
      parameters:
        - $ref: '#/components/parameters/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollmentHostConfirmationRequest' }
      responses:
        '200':
          description: Host confirmation; both confirmations activate the host and create initial owner grants.
          headers:
            DPoP-Nonce: { $ref: '#/components/headers/DPoP-Nonce' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollmentConfirmation' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/host-credentials/challenges:
    post:
      description: Host-client-only challenge issuance. The active installation owner must authenticate with a DPoP key matching the registered installation key. Challenges are valid for 90 seconds, at most four may be pending per installation, and no more than 20 may be created in five minutes.
      responses:
        '201':
          description: Returns a 256-bit one-use challenge. Only its SHA-256 digest is stored.
          headers:
            DPoP-Nonce: { $ref: '#/components/headers/DPoP-Nonce' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostCredentialChallengeCreated' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/host-credentials:
    post:
      description: Host-client-only exchange. An ES256 proof signed by the enrolled installation key binds the installation ID, challenge ID, challenge nonce, audience, issuance time, and a unique proof ID. Challenge consumption and credential insertion are atomic.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HostCredentialExchangeRequest' }
      responses:
        '201':
          description: Returns an opaque five-minute connection credential. Only its SHA-256 digest is stored, and at most eight unexpired credentials may be active per installation. A Relay must still require a fresh signed installation-key challenge when the host connects.
          headers:
            DPoP-Nonce: { $ref: '#/components/headers/DPoP-Nonce' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostConnectionCredentialCreated' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/app/releases/latest:
    get:
      description: Optional configured APK metadata selection. Rechecks the registered phone proof, active school user, exact organization membership and token validity; no runtime/list/content grant is required. The query cannot choose a user or device. Client version/API claims select metadata only. Selection uses stable per-release organization/user/device rollout and the current protocol/Android compatibility gates. No APK bytes, signing private keys or installation action are returned. Unknown, duplicate and noncanonical numeric selectors are rejected. The route is absent without REMOTE_APP_RELEASES_FILE.
      parameters:
        - in: query
          name: organization_id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: version_code
          required: true
          schema: { type: integer, minimum: 1, maximum: 9007199254740991 }
        - in: query
          name: protocol_version
          required: true
          schema: { const: 1 }
        - in: query
          name: android_api
          required: true
          schema: { type: integer, minimum: 26, maximum: 100 }
      responses:
        '200':
          description: Current client support window and the highest eligible newer release, or null. This does not force an update or authorize installation.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, data]
                properties:
                  ok: { const: true }
                  data: { $ref: '#/components/schemas/AppReleaseSelection' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { description: APK release publication is not configured. }
        '503': { $ref: '#/components/responses/Error' }
  /v1/hosts:
    get:
      responses:
        '200':
          description: Hosts visible through active organization membership and runtime grants.
          headers:
            DPoP-Nonce: { $ref: '#/components/headers/DPoP-Nonce' }
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { const: true }
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Host' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/runtimes:
    get:
      responses:
        '200':
          description: Runtimes visible through active grants, including the current user's organization, role and exact grant scope/version. This directory snapshot is not a credential; ticket issuance and operations recheck authority.
          headers:
            DPoP-Nonce: { $ref: '#/components/headers/DPoP-Nonce' }
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { const: true }
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Runtime' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/runtimes/{id}/sessions:
    get:
      parameters:
        - $ref: '#/components/parameters/UUID'
      responses:
        '200':
          description: Session metadata visible through an active session.list grant.
          headers:
            DPoP-Nonce: { $ref: '#/components/headers/DPoP-Nonce' }
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { const: true }
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/runtimes/{id}/sessions/{session_id}:
    get:
      description: Resolve one already-known session under current registered phone proof, membership and session.read. Returns this session's real directory metadata and the caller's current runtime grant without requiring host.list or session.list. This grants no enumeration, subscription or execution authority. Host aliases, native session IDs, paths and bodies are absent. Query selectors are rejected.
      parameters:
        - $ref: '#/components/parameters/UUID'
        - in: path
          name: session_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: One current runtime permission snapshot and one session metadata row.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, data]
                properties:
                  ok: { const: true }
                  data:
                    type: object
                    additionalProperties: false
                    required: [runtime, session]
                    properties:
                      runtime: { $ref: '#/components/schemas/Runtime' }
                      session: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/runtimes/{id}/sessions/{session_id}/question-answers/{request_id}:
    get:
      description: Reconcile only this authenticated device's own typed question.answer request in this exact runtime/session. Requires current session.read and question.answer, owner/operator role and original resource membership; does not confer generic command.status. Records predating action classification and other command purposes are denied. Query selectors are rejected.
      parameters:
        - $ref: '#/components/parameters/UUID'
        - in: path
          name: session_id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: request_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current metadata of the original answer request; no answer body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandStatusResponse'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/runtimes/{id}/sessions/{session_id}/read-access:
    get:
      description: Revalidates this exact session's current read scope and workspace independently of host presence. The response bounds a local cached-history view; it is not a credential or a subscription. Requires an active registered phone's DPoP key and rejects query selectors.
      parameters:
        - $ref: '#/components/parameters/UUID'
        - name: session_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current per-session read authority, bounded by five minutes, the access token and the grant expiry.
          headers:
            DPoP-Nonce: { $ref: '#/components/headers/DPoP-Nonce' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, data]
                properties:
                  ok: { const: true }
                  data: { $ref: '#/components/schemas/SessionReadAccess' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/runtimes/{id}/grants/{user_id}:
    put:
      parameters:
        - $ref: '#/components/parameters/UUID'
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuntimeGrantInput' }
      responses:
        '200':
          description: Grant is created or updated. Runtime owners can delegate only within their own scope; owner scopes include grant.manage. Organization admins may assign owner grants.
          headers:
            DPoP-Nonce: { $ref: '#/components/headers/DPoP-Nonce' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrantUpdated' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      parameters:
        - $ref: '#/components/parameters/UUID'
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Grant revocation is idempotent and transactionally records audit and outbox events.
          headers:
            DPoP-Nonce: { $ref: '#/components/headers/DPoP-Nonce' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrantRevoked' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/realtime/tickets:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RealtimeTicketRequest' }
      responses:
        '201':
          description: Issues a 30-second one-use ticket bound to the active device key version, runtime grant version, and requested scope. Only the ticket hash is stored.
          headers:
            DPoP-Nonce: { $ref: '#/components/headers/DPoP-Nonce' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RealtimeTicketCreated' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/realtime:
    get:
      security: []
      description: >-
        WebSocket upgrade endpoint. Send `Authorization: DSH-Ticket <ticket>` for a mobile device or
        `Authorization: DSH-Host <credential>` for an installation. After upgrade the server issues a
        15-second one-use challenge. A mobile ticket is consumed atomically only after the registered
        device proves its key, so possession of the ticket alone cannot burn it. `hello.ok` is sent only after a signature by the registered P-256
        key. Device `hello.proof` binds device_id, protocols, and capabilities; host `hello.proof` binds
        runtime_id, runtime_epoch, DSH/application/plugin versions, protocol_version, and capabilities.
        Both ES256 proofs bind the challenge_id, nonce, connection_id, audience, and normalized hello
        digest. `hello_sha256` is base64url(SHA-256(domain || length-prefixed UTF-8 fields)); the domain
        is `dsh-mobile-ustc/relay-hello/v1` followed by NUL. Device fields are role, device_id, sorted
        comma-separated protocol numbers, and sorted newline-separated capabilities. Host fields are
        role, runtime_id, runtime_epoch, dsh_version, application_version, plugin_version,
        protocol_version, and newline-separated sorted capabilities. Prefix each field with its
        four-byte big-endian byte length. Proofs use typ dsh-relay-handshake-proof+jwt, alg ES256,
        and exact claims iss, aud, challenge_id, connection_id, nonce, runtime_id, iat, and jti; host
        proofs also include runtime_epoch and hello_sha256. Heartbeats are text frames shaped as
        `{"v":1,"type":"ping","payload":{}}` and receive a pong with connection_id and server_time.
        Devices may send a v=1 `message.submit` frame with request_id, runtime_id, session_id, and
        payload {mode: queue|steer, content: [{type: text, text: ...}]}. Text content is bounded to
        32,768 Unicode characters per block and 16 blocks per frame; the complete UTF-8 frame is
        limited to 64 KiB. Both peers may additionally negotiate `session.cancel.v1` for an
        epoch-bound `session.cancel` with an empty payload and explicit session.cancel action.
        Negotiating `session.create.v1` allows `session.create` with the current runtime_epoch and
        payload {workspace_id, preset}, before a session UUID exists. It requires session.create
        and workspace scope; the host maps the UUID to one configured local workspace and preset.
        The additive session.create_options.v1 extension uses host session.create.options / .ack
        and phone session.create.options.get / .result frames for current scoped workspace UUIDs,
        explicit public labels and allowed preset tokens. Snapshots are held only by the active
        host connection, bounded to 128 workspaces / 128 presets and 16 MiB across live hosts.
        Labels have at most 32 scalar characters / 128 UTF-8 bytes; no local paths or definitions
        are returned. The service rechecks the current phone lease and workspace scope.
        Creation receipts include payload.workspace_id; a settled receipt adds the resulting
        session_id. Matching retries return stored state; changed bodies conflict. Peers may negotiate
        `question.blocking.v1` for question.snapshot frames on a scoped session subscription and
        epoch-bound question.answer commands with {question_id, answers}. Reading requires session.read;
        answering separately requires question.answer. The separate question.timed.v1 capability
        adds question.timed.snapshot, subscription/sync-bound question.claim and question.release,
        and epoch-bound question.timed.answer. Claims require read and answer authority, are
        connection-scoped and are released on unsubscribe/disconnect. Late answers use the native
        continued-message path and report agent_queued only after the session checkpoint.
        Signed tool approvals remain separate. Each submission rechecks device key version, current
        grant version, message.submit action, and session/workspace scope. PostgreSQL stores only the
        command ID/session/state and canonical payload digest. The host receives the request ID,
        digest, and authenticated user/device IDs, then returns v=1 `command.receipt` frames with the
        device_id, state, and matching digest. Receipts advance through the host_accepted/agent_queued
        state machine and persist without storing message bodies. Hosts also publish indexed
        `session.catalog` metadata with stable session IDs, opaque DSH IDs, mapped workspace IDs,
        state, and the last persisted sequence. Complete snapshots atomically replace the directory;
        bounded deltas update changed sessions. Relay accepts them only from the current
        key-version-bound runtime connection, verifies the runtime-namespaced UUIDv5 session mapping,
        and stores no session body, title,
        workspace path, or event content. Missing sessions become unavailable; disconnect marks the
        runtime's sessions unavailable until the next catalog snapshot. Request IDs are idempotent per
        device; a changed digest returns command.request_conflict. Both peers may also negotiate
        `session.read.v1` for session.subscribe/unsubscribe/page and host snapshot/event/checkpoint,
        assistant.start/chunk/end, and page-result frames. An explicit session.read action is required
        in both ticket and current runtime grant. Relay creates a per-connection subscription_id;
        host creates sync_id and enforces fixed-cursor pagination. Each content frame rechecks the
        current host connection, device key, grant version, and session/workspace scope. Projected
        payloads larger than one frame use ordered session.fragment frames, limited to 2 MiB before
        base64 encoding. Session bodies remain transient. Approval/question routing is not enabled.
        Host catalogs require `session.catalog.v1`; peers must negotiate `command.relay.v1` to exchange
        message and receipt frames. Application heartbeats are limited to one per second; message
        submits and read operations share 20 requests per second per socket. Subscriptions are limited
        to 16 per device socket and 32 per host connection. Each socket has a bounded outbound queue. Device
        connections expire within five minutes; host connections expire with their host credential.
        Frame JSON Schemas and golden messages are in `contracts/ws/v1`. Never log Authorization
        headers on this route.
      responses:
        '101': { description: WebSocket upgraded; client must answer the challenge before hello.ok is sent. Subprotocol dsh.remote.v1 is required. }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/approvals/{id}/decisions:
    post:
      description: Available only when REMOTE_APPROVAL_POLICY_FILE enables the signed approval service. A fresh JWT/DPoP request is bound to a live mobile WSS connection and that socket's exact owner/read/approval scope. The service retrieves the immutable context from the current host, verifies assurance and the phone JWS, commits the decision, and independently signs a short host authorization lease. A persisted acceptance or forwarded frame is not tool execution.
      parameters:
        - $ref: '#/components/parameters/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [connection_id, decision_jws]
              properties:
                connection_id: { type: string, format: uuid, description: The currently admitted mobile socket using the same registered DPoP key. }
                decision_jws: { type: string, minLength: 1, maxLength: 16384, description: Canonical ES256 approval decision using the separately registered approval key. }
      responses:
        '200':
          description: The decision is durably recorded. delivery pending requires reconciliation; forwarded confirms a transport write, and recorded returns an existing execution/status fact. None alone proves tool success.
          headers:
            DPoP-Nonce: { $ref: '#/components/headers/DPoP-Nonce' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, data]
                properties:
                  ok: { const: true }
                  data:
                    type: object
                    additionalProperties: false
                    required: [status, delivery]
                    properties:
                      status: { $ref: '#/components/schemas/ApprovalStatus' }
                      delivery: { enum: [pending, forwarded, recorded] }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { description: Signed approval service is not configured. }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/commands/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: device_id
          in: query
          required: true
          description: Must identify the active device whose DPoP key authenticated this request.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Command metadata only; request body and chat content are not returned.
          headers:
            DPoP-Nonce: { $ref: '#/components/headers/DPoP-Nonce' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandStatusResponse'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/runtimes/{id}/sessions/{session_id}/files:
    post:
      description: Register an immutable to-host file intent and reserve organization/user/session quota. Requires the active phone device and current file.upload authority. Same-device same-ID identical retries return the original file; changed target/content conflicts. Upload URLs are ephemeral quarantine capabilities; no bytes or native receipt are accepted here. Returns 404 when files are not configured.
      parameters:
        - $ref: '#/components/parameters/UUID'
        - name: session_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FileRegistration' }
      responses:
        '201':
          description: Original file metadata and, only while currently authorized and uploading, a short-lived quarantine PUT capability. No capability is included for an already committed/terminal intent.
          headers:
            DPoP-Nonce: { $ref: '#/components/headers/DPoP-Nonce' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FilePreparedResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { description: File service is not configured. }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/files/{id}:
    get:
      description: Reconcile the original phone device's file metadata under current authority. Direction to_host uses file.upload; from_host uses session.read and file.download. Returns no object key, lease, native receipt or upload capability. Another device cannot select the original requester via request fields. Returns 404 when files are not configured.
      parameters:
        - $ref: '#/components/parameters/UUID'
      responses:
        '200':
          description: Current durable transfer metadata; clean means bytes/scan/storage evidence passed, not that a host received or queued a message.
          headers:
            DPoP-Nonce: { $ref: '#/components/headers/DPoP-Nonce' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileStatusResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { description: File service is not configured. }
        '503': { $ref: '#/components/responses/Error' }
  /v1/files/{id}/upload-url:
    post:
      description: Refresh a quarantine PUT capability for the exact original intent, device key/version and grant version. Allowed only in uploading before its original upload window expires. Signed URLs are not immediately revocable and never address committed objects. Returns 404 when files are not configured.
      parameters:
        - $ref: '#/components/parameters/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, maxProperties: 0 }
      responses:
        '200':
          description: Original metadata and a refreshed short-lived capability within the original expiry.
          headers:
            DPoP-Nonce: { $ref: '#/components/headers/DPoP-Nonce' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FilePreparedResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { description: File service is not configured. }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/file-exports/{id}:
    get:
      description: Resolve the original device's immutable export request UUID back to its file metadata after a lost registration response. Requires current session.read and file.download scope. This endpoint does not prepare a new Host source or re-admit an expired source. Export downloads must be explicitly enabled; missing and inaccessible records both fail closed.
      parameters:
        - $ref: '#/components/parameters/UUID'
      responses:
        '200':
          description: Original from_host file metadata without private Host provenance or capabilities.
          headers:
            DPoP-Nonce: { $ref: '#/components/headers/DPoP-Nonce' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileStatusResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { description: Export downloads are not configured. }
        '503': { $ref: '#/components/responses/Error' }
  /v1/files/{id}/content:
    get:
      description: Phone-only JWT/DPoP proxy for an owned, clean from_host export. Rechecks current device, session.read/file.download scope and scanner policy on renewable five-second leases; grant-generation changes cancel an existing stream. The request is bounded by token expiry and five minutes. Range and query selectors are refused. Committed object bytes are checked against exact length/SHA-256 before the final chunk; an interrupted response must not be published by the client. No public object URL or bearer download capability is returned. Export downloads must be explicitly enabled.
      parameters:
        - $ref: '#/components/parameters/UUID'
      responses:
        '200':
          description: Exact verified committed bytes; served is a server-side fact, and the phone independently verifies its saved document.
          headers:
            DPoP-Nonce: { $ref: '#/components/headers/DPoP-Nonce' }
            Content-Length: { schema: { type: integer, minimum: 0, maximum: 2000000000 } }
            Content-Disposition: { schema: { type: string }, description: Attachment with a safely encoded display filename. }
            X-DSH-Content-SHA256: { schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
            Cache-Control: { schema: { const: 'no-store, no-transform' } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { description: Export downloads are not configured. }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/files/{id}/commit:
    post:
      description: Request a durable background scan after the client PUT. This call does not trust object HEAD as content evidence and does not mark clean. Idempotent repeats return current state. Returns 404 when files are not configured.
      parameters:
        - $ref: '#/components/parameters/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, maxProperties: 0 }
      responses:
        '202':
          description: Scanning is pending/in progress; query original status.
          headers:
            DPoP-Nonce: { $ref: '#/components/headers/DPoP-Nonce' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileStatusResponse' }
        '200':
          description: Original terminal/current durable state; no scan or tool replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileStatusResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { description: File service is not configured. }
        '503': { $ref: '#/components/responses/Error' }
  /v1/host-files/{id}/content:
    get:
      description: Host-only proxy read under negotiated file.handoff.v1. The five-second renewable handoff binds the live installation key, runtime epoch, connection, original uploader authority and clean scanner policy. A valid proof atomically consumes the ticket once before object I/O. Revocation, disconnect and expiry cancel pending headers and body reads. Interrupted reads need a new handoff; redirects and range/query selectors are unsupported.
      security:
        - HostFileTicket: []
          HostFileProof: []
      parameters:
        - $ref: '#/components/parameters/UUID'
      responses:
        '200':
          description: Exact authorized clean object bytes. Host must verify size and SHA-256 before native attachment admission.
          headers:
            Cache-Control: { schema: { const: no-store } }
            Content-Length: { schema: { type: integer, minimum: 0, maximum: 200000000 } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { description: File service is not configured. }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/push/capabilities:
    get:
      description: Optional notification service capabilities for an active DPoP-bound device. Routes are absent unless protected push configuration is enabled. Provider configuration is public metadata, not a delivery guarantee.
      responses:
        '200':
          description: Supported provider/address and source kinds.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushCapabilitiesResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/push-bindings:
    post:
      description: Persist the original device/org-bound intent and encrypted FCM FID. A NORMAL-priority provider message carries a short one-use challenge; the HTTP response never returns that challenge or address. The channel stays pending until the same device proves receipt. Reusing the ID with another endpoint, org, key or deletion-secret hash conflicts.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../push/v1/registration.schema.json' }
      responses:
        '201':
          description: Original pending/active channel metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushBindingResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/push-bindings/{id}:
    parameters:
      - $ref: '#/components/parameters/UUID'
    get:
      description: Read only this original device/key/org registration; it cannot create, verify or revive a channel.
      responses:
        '200':
          description: Current registration metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushBindingResponse' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      security: []
      description: Deletion-only logout cleanup using the client-generated 32-byte secret whose SHA-256 was registered. It remains usable after OAuth logout. No secret in a query/body; this endpoint cannot read data or move an address to another account. Unknown/incorrect secrets have the same empty response. Clients must clear local notification routing before calling.
      parameters:
        - in: header
          name: Authorization
          required: true
          schema: { type: string, pattern: '^DSH-Push-Revoke [A-Za-z0-9_-]{43}$' }
      responses:
        '204': { description: Cleanup request processed without disclosing registration existence. }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/push-bindings/{id}/confirm:
    post:
      parameters:
        - $ref: '#/components/parameters/UUID'
      description: Confirm the provider-delivered challenge under the original current device/key/org. Pending registrations cannot displace an active address. The original holder must disable the old channel before a verified transfer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge]
              properties:
                challenge: { type: string, minLength: 43, maxLength: 43, writeOnly: true }
      responses:
        '200':
          description: Verified active channel, or the same original confirmation result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushBindingResponse' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
  /v1/push-bindings/{id}/lease:
    post:
      parameters:
        - $ref: '#/components/parameters/UUID'
      description: Renew a currently confirmed, unexpired channel using the original active device proof. An expired or changed-key channel needs a new explicit registration and provider challenge.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: Current channel lease metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushBindingResponse' }
        '403': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
  /v1/notifications:
    get:
      description: Paged materialized notification references for this original channel, independently filtered by current device/key/org and source authority. This is not a second body store or an execution API. Reconcile native session state for details and any action.
      parameters:
        - in: query
          name: binding_id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: after
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: At most 64 authorized references and the next opaque UUID position.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, data]
                properties:
                  ok: { const: true }
                  data:
                    type: object
                    additionalProperties: false
                    required: [items, cursor]
                    properties:
                      items:
                        type: array
                        maxItems: 64
                        items: { $ref: '../push/v1/reference.schema.json' }
                      cursor: { type: [string, 'null'], format: uuid }
        '403': { $ref: '#/components/responses/Error' }
  /v1/notifications/{id}:
    get:
      parameters:
        - $ref: '#/components/parameters/UUID'
      description: Reauthorize a pushed opaque ID against the current device, org, grant and source metadata. Returns no approval parameters, question body, decision, signature or callback. Original-epoch and host availability are explicit facts, not authorization to approve.
      responses:
        '200':
          description: Current source reference.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, data]
                properties:
                  ok: { const: true }
                  data:
                    type: object
                    additionalProperties: false
                    required: [reference]
                    properties:
                      reference: { $ref: '../push/v1/reference.schema.json' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/notifications/{id}/receipts:
    post:
      parameters:
        - $ref: '#/components/parameters/UUID'
      description: Idempotent current-device telemetry only. Posted means the client reports an OS posting attempt, not that a human saw it; opened and blocked never authorize or change the underlying interaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [state]
              properties:
                state: { enum: [posted, opened, blocked] }
      responses:
        '200': { description: Client report stored or already present. }
        '403': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    HostFileTicket:
      type: http
      scheme: DSH-File
      description: Opaque 32-byte base64url one-use ticket received over the current authenticated Host WSS connection. Stored only as SHA-256; never sent to object storage.
    HostFileProof:
      type: apiKey
      in: header
      name: X-DSH-File-Proof
      description: Registered installation-key ES256 JWS with typ dsh-file-read-proof+jwt, audience urn:dsh-mobile-ustc:file-read and exact iss/htm/htu/runtime_id/runtime_epoch/connection_id/handoff_id/file_id/ath/iat/jti claims. ath is base64url SHA-256 of the ticket. iat accepts at most 30 seconds skew. Embedded keys and extra claims/header fields are refused.
    DPoP:
      type: http
      scheme: DPoP
      description: JWT access token sender-constrained with an ES256 DPoP proof; nonce and jti are single-use. Directory, command-status, and revocation routes also require the proof key to belong to a non-revoked device.
  parameters:
    UUID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: Stable non-sensitive service error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  headers:
    DPoP-Nonce:
      description: One-use nonce to include in the next DPoP proof for this key.
      schema: { type: string, minLength: 32, maxLength: 64 }
  schemas:
    PushCapabilitiesResponse:
      type: object
      additionalProperties: false
      required: [ok, data]
      properties:
        ok: { const: true }
        data:
          type: object
          additionalProperties: false
          required: [v, providers, sources, verification, lease_seconds]
          properties:
            v: { const: 1 }
            providers:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [provider, project_id, package_name, address_kind]
                properties:
                  provider: { const: fcm }
                  project_id: { type: string }
                  package_name: { type: string }
                  address_kind: { const: fid }
            sources:
              type: array
              uniqueItems: true
              items: { enum: [approval, question, timed_question] }
            verification: { const: provider_challenge }
            lease_seconds: { const: 604800 }
    PushBindingResponse:
      type: object
      additionalProperties: false
      required: [ok, data]
      properties:
        ok: { const: true }
        data:
          type: object
          additionalProperties: false
          required: [binding]
          properties:
            binding:
              type: object
              additionalProperties: false
              required: [binding_id, state, challenge_expires_at, expires_at]
              properties:
                binding_id: { type: string, format: uuid }
                state: { enum: [pending, active, disabled, expired] }
                challenge_expires_at: { type: string, format: date-time }
                expires_at: { type: string, format: date-time }
    FileRegistration:
      type: object
      additionalProperties: false
      required: [request_id, name, size_bytes, sha256]
      properties:
        request_id: { type: string, format: uuid }
        name:
          type: string
          minLength: 1
          maxLength: 512
          description: Pure display filename, also bounded to 512 UTF-8 bytes by the server; no path separators, control characters, dot/dotdot or whitespace-only names.
          pattern: '^(?!\.{1,2}$)(?!\s*$)[^/\\\u0000-\u001f\u007f-\u009f]+$'
        size_bytes: { type: integer, minimum: 0, maximum: 200000000 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    FileStatus:
      type: object
      additionalProperties: false
      required: [file_id, runtime_id, session_id, direction, name, size_bytes, sha256, state, upload_expires_at, expires_at, created_at]
      properties:
        delivery: { $ref: '#/components/schemas/FileDeliveryHint' }
        file_id: { type: string, format: uuid }
        runtime_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        direction: { enum: [to_host, from_host] }
        name: { type: string, minLength: 1, maxLength: 512 }
        size_bytes: { type: integer, minimum: 0, maximum: 2000000000 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        state: { enum: [uploading, scanning, clean, rejected, expired] }
        error_code: { enum: [integrity_mismatch, content_rejected, scan_unavailable, storage_unavailable, access_revoked, expired] }
        upload_expires_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
      allOf:
        - if:
            properties:
              direction: { const: to_host }
          then:
            properties:
              size_bytes: { type: integer, maximum: 200000000 }
        - if:
            properties:
              direction: { const: from_host }
          then:
            properties:
              delivery: false
    FileDeliveryHint:
      description: Advisory current Host readiness or the original command reference; never an admission capability. Ready expires within the current handoff lease. Every send is separately authorized.
      oneOf:
        - type: object
          additionalProperties: false
          required: [state]
          properties:
            state: { const: waiting }
        - type: object
          additionalProperties: false
          required: [state, expires_at]
          properties:
            state: { const: ready }
            expires_at: { type: string, format: date-time }
        - type: object
          additionalProperties: false
          required: [state, request_id, command_state]
          properties:
            state: { const: bound }
            request_id: { type: string, format: uuid }
            command_state: { enum: [received, host_accepted, dispatching, agent_queued, observed, settled, rejected, outcome_unknown] }
    FileUploadCapability:
      type: object
      additionalProperties: false
      required: [url, method, headers, expires_at]
      properties:
        url: { type: string, format: uri, pattern: '^https://' }
        method: { const: PUT }
        headers:
          type: object
          additionalProperties: { type: string, maxLength: 4096, pattern: '^[^\r\n]*$' }
        expires_at: { type: string, format: date-time }
    FilePreparedResponse:
      type: object
      additionalProperties: false
      required: [ok, data]
      properties:
        ok: { const: true }
        data:
          type: object
          additionalProperties: false
          required: [file]
          properties:
            file:
              allOf:
                - $ref: '#/components/schemas/FileStatus'
                - type: object
                  properties:
                    direction: { const: to_host }
            upload: { $ref: '#/components/schemas/FileUploadCapability' }
    FileStatusResponse:
      type: object
      additionalProperties: false
      required: [ok, data]
      properties:
        ok: { const: true }
        data:
          type: object
          additionalProperties: false
          required: [file]
          properties:
            file: { $ref: '#/components/schemas/FileStatus' }
    ApprovalStatus:
      type: object
      additionalProperties: false
      required: [approval_id, runtime_id, runtime_epoch, session_id, execution_id, binding_sha256, state, expires_at]
      properties:
        approval_id: { type: string, format: uuid }
        runtime_id: { type: string, format: uuid }
        runtime_epoch: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        execution_id: { type: string, format: uuid }
        binding_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        state: { enum: [pending, decision_received, allowed, denied, expired, cancelled, invalidated, outcome_unknown] }
        decision: { enum: [allow_once, reject] }
        decision_payload_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        expires_at: { type: string, format: date-time }
        host_state: { enum: [approved, denied, consumed, settled, expired, cancelled, invalidated, outcome_unknown] }
        execution_outcome: { enum: [succeeded, failed, cancelled], description: Present only for a settled native result. }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [ok, error]
      properties:
        ok: { const: false }
        error:
          type: object
          additionalProperties: false
          required: [code]
          properties:
            code: { type: string }
    MeResponse:
      type: object
      additionalProperties: false
      required: [ok, data]
      properties:
        ok: { const: true }
        data:
          type: object
          additionalProperties: false
          required: [issuer, subject, client_id, scopes, user_id, memberships]
          properties:
            issuer: { type: string, format: uri }
            subject: { type: string }
            client_id: { type: string }
            scopes: { type: array, items: { type: string }, uniqueItems: true }
            user_id: { type: string, format: uuid }
            memberships:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [organization_id, role]
                properties:
                  organization_id: { type: string, format: uuid }
                  role: { enum: [member, admin] }
    CurrentDeviceResponse:
      type: object
      additionalProperties: false
      required: [ok, data]
      properties:
        ok: { const: true }
        data:
          oneOf:
            - type: object
              additionalProperties: false
              required: [state]
              properties:
                state: { const: unregistered }
            - type: object
              additionalProperties: false
              required: [state, device]
              properties:
                state: { enum: [active, revoked] }
                device:
                  type: object
                  additionalProperties: false
                  required: [device_id, key_version, approval_key_jkt, proof_key_jkt]
                  properties:
                    device_id: { type: string, format: uuid }
                    key_version: { type: integer, minimum: 1, maximum: 9007199254740991 }
                    approval_key_jkt: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
                    proof_key_jkt: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
    DeviceRegistration:
      type: object
      additionalProperties: false
      required: [name, approval_public_jwk, approval_proof, proof_public_jwk]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        approval_public_jwk: { $ref: '#/components/schemas/P256PublicJWK' }
        approval_proof:
          type: string
          minLength: 1
          maxLength: 8192
          description: ES256 JWS signed by approval_public_jwk; binds issuer, subject, both key thumbprints, normalized name digest, current DPoP jti, iat, and a unique jti.
        proof_public_jwk: { $ref: '#/components/schemas/P256PublicJWK' }
    P256PublicJWK:
      type: object
      additionalProperties: false
      required: [kty, crv, x, y]
      properties:
        kty: { const: EC }
        crv: { const: P-256 }
        x: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$' }
        y: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$' }
        alg: { const: ES256 }
        use: { const: sig }
        key_ops: { type: array, items: { const: verify }, minItems: 1, maxItems: 1 }
        kid: { type: string, maxLength: 128 }
        ext: { type: boolean }
    DeviceResponse:
      type: object
      additionalProperties: false
      required: [ok, data]
      properties:
        ok: { const: true }
        data:
          type: object
          additionalProperties: false
          required: [device_id, key_version]
          properties:
            device_id: { type: string, format: uuid }
            key_version: { type: integer, const: 1 }
    DeviceRevoked:
      type: object
      additionalProperties: false
      required: [ok, data]
      properties:
        ok: { const: true }
        data:
          type: object
          additionalProperties: false
          required: [revoked]
          properties:
            revoked: { const: true }
    RuntimeGrantInput:
      type: object
      additionalProperties: false
      required: [role, scope]
      properties:
        role: { enum: [viewer, operator, owner] }
        scope: { $ref: '#/components/schemas/GrantScope' }
        expires_at: { type: [string, 'null'], format: date-time }
    GrantScope:
      type: object
      additionalProperties: false
      required: [actions, workspaces, sessions]
      properties:
        actions:
          type: array
          uniqueItems: true
          maxItems: 12
          items:
            enum: [host.list, session.list, session.read, command.status, session.create, message.submit, session.cancel, session.archive, approval.decide, question.answer, file.upload, file.download, grant.manage]
        workspaces:
          type: array
          uniqueItems: true
          maxItems: 256
          items: { type: string, format: uuid }
        sessions:
          type: array
          uniqueItems: true
          maxItems: 256
          items: { type: string, format: uuid }
    GrantUpdated:
      type: object
      additionalProperties: false
      required: [ok, data]
      properties:
        ok: { const: true }
        data:
          type: object
          additionalProperties: false
          required: [grant_version]
          properties:
            grant_version: { type: integer, minimum: 1 }
    GrantRevoked:
      type: object
      additionalProperties: false
      required: [ok, data]
      properties:
        ok: { const: true }
        data:
          type: object
          additionalProperties: false
          required: [revoked, grant_version]
          properties:
            revoked: { const: true }
            grant_version: { type: integer, minimum: 1 }
    RealtimeTicketRequest:
      type: object
      additionalProperties: false
      required: [runtime_id, scope]
      properties:
        runtime_id: { type: string, format: uuid }
        scope: { $ref: '#/components/schemas/RealtimeTicketScope' }
    RealtimeTicketScope:
      type: object
      additionalProperties: false
      required: [actions, workspaces, sessions]
      properties:
        actions:
          type: array
          minItems: 1
          uniqueItems: true
          maxItems: 11
          items:
            enum: [host.list, session.list, session.read, command.status, session.create, message.submit, session.cancel, session.archive, approval.decide, question.answer, file.upload, file.download]
        workspaces:
          type: array
          uniqueItems: true
          maxItems: 256
          items: { type: string, format: uuid }
        sessions:
          type: array
          uniqueItems: true
          maxItems: 256
          items: { type: string, format: uuid }
    RealtimeTicketCreated:
      type: object
      additionalProperties: false
      required: [ok, data]
      properties:
        ok: { const: true }
        data:
          type: object
          additionalProperties: false
          required: [ticket, runtime_id, grant_version, scope, expires_at]
          properties:
            ticket: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$' }
            runtime_id: { type: string, format: uuid }
            grant_version: { type: integer, minimum: 1 }
            scope: { $ref: '#/components/schemas/RealtimeTicketScope' }
            expires_at: { type: string, format: date-time }
    EnrollmentCreateRequest:
      type: object
      additionalProperties: false
      required: [request_id, organization_id, alias, profile_ref, protocol_version, installation_public_jwk, code, workspace_refs]
      properties:
        request_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        host_id:
          type: string
          format: uuid
          description: Optional active host to attach another OS-user installation; requires an organization admin or an owner of an installation already on that host.
        alias: { type: string, minLength: 1, maxLength: 160 }
        profile_ref: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$' }
        dsh_version: { type: string, maxLength: 128 }
        application_version: { type: string, maxLength: 128 }
        plugin_version: { type: string, maxLength: 128 }
        protocol_version: { type: integer, minimum: 1, maximum: 32 }
        installation_public_jwk: { $ref: '#/components/schemas/P256PublicJWK' }
        code: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$' }
        workspace_refs:
          type: array
          maxItems: 64
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$' }
    EnrollmentCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$' }
    EnrollmentHostConfirmationRequest:
      type: object
      additionalProperties: false
      required: [code, confirmed_user_id]
      properties:
        code: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$' }
        confirmed_user_id: { type: string, format: uuid, description: The confirming user reviewed by the installation owner. }
    HostCredentialExchangeRequest:
      type: object
      additionalProperties: false
      required: [challenge_id, proof]
      properties:
        challenge_id: { type: string, format: uuid }
        proof:
          type: string
          minLength: 1
          maxLength: 8192
          description: ES256 compact JWS with typ dsh-host-credential-proof+jwt, signed by the enrolled installation key. Claims are iss installation_id, aud urn:dsh-mobile-ustc:host-credential, challenge_id, nonce, iat and unique jti.
    HostCredentialChallengeCreated:
      type: object
      additionalProperties: false
      required: [ok, data]
      properties:
        ok: { const: true }
        data:
          type: object
          additionalProperties: false
          required: [challenge_id, challenge, installation_id, audience, expires_at]
          properties:
            challenge_id: { type: string, format: uuid }
            challenge: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$' }
            installation_id: { type: string, format: uuid }
            audience: { const: urn:dsh-mobile-ustc:host-credential }
            expires_at: { type: string, format: date-time }
    HostConnectionCredentialCreated:
      type: object
      additionalProperties: false
      required: [ok, data]
      properties:
        ok: { const: true }
        data:
          type: object
          additionalProperties: false
          required: [credential, token_type, installation_id, key_thumbprint, expires_at]
          properties:
            credential: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$' }
            token_type: { const: DSH-Host }
            installation_id: { type: string, format: uuid }
            key_thumbprint: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$' }
            expires_at: { type: string, format: date-time }
    EnrollmentCreated:
      type: object
      additionalProperties: false
      required: [ok, data]
      properties:
        ok: { const: true }
        data:
          type: object
          additionalProperties: false
          required: [enrollment_id, request_id, host_id, installation_id, runtime_id, profile_ref, state, expires_at, workspaces]
          properties:
            enrollment_id: { type: string, format: uuid }
            request_id: { type: string, format: uuid }
            host_id: { type: string, format: uuid }
            installation_id: { type: string, format: uuid }
            runtime_id: { type: string, format: uuid }
            profile_ref: { type: string }
            state: { enum: [pending, user_confirmed, approved, expired, denied, cancelled] }
            expires_at: { type: string, format: date-time }
            workspaces: { type: array, items: { $ref: '#/components/schemas/EnrollmentWorkspace' } }
    EnrollmentDetails:
      type: object
      additionalProperties: false
      required: [ok, data]
      properties:
        ok: { const: true }
        data: { $ref: '#/components/schemas/EnrollmentRecord' }
    EnrollmentRecord:
      type: object
      additionalProperties: false
      required: [enrollment_id, request_id, organization_id, organization_name, host_id, host_alias, installation_id, installation_key_jkt, runtime_id, profile_ref, protocol_version, state, expires_at, host_confirmed, user_confirmed, user_confirmed_by_me, workspaces]
      properties:
        enrollment_id: { type: string, format: uuid }
        request_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        organization_name: { type: string }
        host_id: { type: string, format: uuid }
        host_alias: { type: string }
        installation_id: { type: string, format: uuid }
        installation_key_jkt: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        runtime_id: { type: string, format: uuid }
        profile_ref: { type: string }
        dsh_version: { type: string }
        application_version: { type: string }
        plugin_version: { type: string }
        protocol_version: { type: integer, minimum: 1 }
        state: { enum: [pending, user_confirmed, approved, denied, expired, cancelled] }
        expires_at: { type: string, format: date-time }
        host_confirmed: { type: boolean }
        user_confirmed: { type: boolean }
        user_confirmed_by_me: { type: boolean }
        workspaces: { type: array, items: { $ref: '#/components/schemas/EnrollmentWorkspace' } }
    EnrollmentHostReview:
      type: object
      additionalProperties: false
      required: [ok, data]
      properties:
        ok: { const: true }
        data:
          type: object
          additionalProperties: false
          required: [enrollment, confirmed_user]
          properties:
            enrollment: { $ref: '#/components/schemas/EnrollmentRecord' }
            confirmed_user:
              oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/EnrollmentReviewUser'
    EnrollmentReviewUser:
      type: object
      additionalProperties: false
      required: [user_id, issuer, subject, eligible]
      properties:
        user_id: { type: string, format: uuid }
        issuer: { type: string }
        subject: { type: string }
        eligible: { type: boolean, description: The user and confirming device/key version are active, the user belongs to the organization, and the target is not revoked; confirmation rechecks these conditions transactionally. }
    EnrollmentWorkspace:
      type: object
      additionalProperties: false
      required: [reference, workspace_id]
      properties:
        reference: { type: string }
        workspace_id: { type: string, format: uuid }
    EnrollmentConfirmation:
      type: object
      additionalProperties: false
      required: [ok, data]
      properties:
        ok: { const: true }
        data:
          type: object
          additionalProperties: false
          required: [enrollment_id, host_id, runtime_id, state, expires_at, host_confirmed, user_confirmed]
          properties:
            enrollment_id: { type: string, format: uuid }
            host_id: { type: string, format: uuid }
            runtime_id: { type: string, format: uuid }
            state: { enum: [pending, user_confirmed, approved] }
            expires_at: { type: string, format: date-time }
            host_confirmed: { type: boolean }
            user_confirmed: { type: boolean }
    Host:
      type: object
      additionalProperties: false
      required: [id, alias, state]
      properties:
        id: { type: string, format: uuid }
        alias: { type: string }
        state: { const: active }
    ClientVersionWindow:
      type: object
      additionalProperties: false
      required: [minimum, maximum]
      properties:
        minimum: { type: integer, minimum: 1, maximum: 9007199254740991 }
        maximum: { type: integer, minimum: 1, maximum: 9007199254740991, description: Inclusive; must be at least minimum. }
    AppReleaseSelection:
      type: object
      additionalProperties: false
      required: [v, package_name, protocol_version, current_version_code, current_supported, supported_client_versions, release]
      properties:
        v: { const: 1 }
        package_name: { type: string, maxLength: 255 }
        protocol_version: { const: 1 }
        current_version_code: { type: integer, minimum: 1, maximum: 9007199254740991 }
        current_supported: { type: boolean, description: Must agree with the inclusive published client version window; does not itself enforce or force an update. }
        supported_client_versions: { $ref: '#/components/schemas/ClientVersionWindow' }
        release:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/AppRelease' }
    AppRelease:
      type: object
      additionalProperties: false
      required: [release_id, version_code, version_name, package_name, sha256, size_bytes, signing_cert_sha256, download_url, minimum_protocol_version, maximum_protocol_version, minimum_android_api, rollout_basis_points, release_notes]
      properties:
        release_id: { type: string, format: uuid }
        version_code: { type: integer, minimum: 1, maximum: 9007199254740991, description: Must be newer than the actual installed version and inside the service's supported client window. }
        version_name: { type: string, minLength: 1, maxLength: 64, description: At most 64 UTF-8 bytes; no control characters. }
        package_name: { type: string, maxLength: 255 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        size_bytes: { type: integer, minimum: 1, maximum: 536870912 }
        signing_cert_sha256: { type: string, pattern: '^[0-9a-f]{64}$', description: Candidate certificate digest to compare with the independently verified installed signing trust anchor; metadata cannot create new trust. }
        download_url: { type: string, format: uri, maxLength: 2048, description: Canonical HTTPS URL from a provisioned download-origin allowlist; no userinfo, query, fragment, encoded/relative path or redirects. }
        minimum_protocol_version: { type: integer, minimum: 1, maximum: 32 }
        maximum_protocol_version: { type: integer, minimum: 1, maximum: 32, description: Inclusive and at least minimum_protocol_version. }
        minimum_android_api: { type: integer, minimum: 26, maximum: 100 }
        rollout_basis_points: { type: integer, minimum: 1, maximum: 10000, description: One percent is 100 basis points. Zero-percent publications cannot be selected. }
        release_notes: { type: string, minLength: 1, maxLength: 8192, description: Nonblank plain text limited to 8192 UTF-8 bytes; newline/tab allowed, other control characters denied. }
    Runtime:
      type: object
      additionalProperties: false
      required: [id, host_id, protocol_version]
      properties:
        id: { type: string, format: uuid }
        host_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        dsh_version: { type: string }
        application_version: { type: string }
        plugin_version: { type: string }
        protocol_version: { type: integer, minimum: 1 }
        last_seen_at: { type: string, format: date-time }
        access:
          type: object
          additionalProperties: false
          required: [role, grant_version, scope]
          properties:
            role: { enum: [viewer, operator, owner] }
            grant_version: { type: integer, minimum: 1, maximum: 9007199254740991 }
            scope: { $ref: '#/components/schemas/GrantScope' }
            expires_at: { type: string, format: date-time }
    Session:
      type: object
      additionalProperties: false
      required: [session_id, state, last_persisted_seq, updated_at]
      properties:
        session_id: { type: string, format: uuid }
        workspace_id: { type: [string, 'null'], format: uuid, description: Opaque registered workspace UUID; never a filesystem path. Null means only an explicit session grant can cover this session. }
        state: { enum: [available, running, archived, unavailable] }
        last_persisted_seq: { type: integer, minimum: -1 }
        updated_at: { type: string, format: date-time }
    SessionReadAccess:
      type: object
      additionalProperties: false
      required: [runtime_id, session_id, workspace_id, grant_version, issued_at, expires_at]
      properties:
        runtime_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        workspace_id: { type: [string, 'null'], format: uuid }
        grant_version: { type: integer, minimum: 1, maximum: 9007199254740991 }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    CommandStatusResponse:
      type: object
      additionalProperties: false
      required: [ok, data]
      properties:
        ok: { const: true }
        data:
          type: object
          additionalProperties: false
          required: [request_id, state, payload_sha256, updated_at]
          anyOf:
            - required: [session_id]
            - required: [workspace_id]
          properties:
            request_id: { type: string, format: uuid }
            session_id: { type: string, format: uuid }
            workspace_id: { type: string, format: uuid, description: Original workspace target of a session creation command; session_id appears after settlement. }
            state: { enum: [received, host_accepted, dispatching, agent_queued, observed, settled, rejected, outcome_unknown] }
            payload_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
            updated_at: { type: string, format: date-time }
